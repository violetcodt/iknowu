["regulator","监管机构","B",""],["regulation","监管 / 法规","B",""],

["prudential regulation","审慎监管","B",""],["macro-prudential","宏观审慎","B",""],
["capital adequacy","资本充足率","B",""],["reserve requirement","存款准备金（率）","B",""],
["compliance","合规","B",""],["governance","治理","B","corporate governance 公司治理"],
["disclosure","信息披露","B",""],["credit risk","信用风险","B",""],
["market risk","市场风险","B",""],["operational risk","操作风险","B",""],
["liquidity risk","流动性风险","B",""],["non-performing loan","不良贷款","B",""],
["provision","拨备 / 准备金","B",""],["deposit","存款","B",""],["loan","贷款","B",""],
["interest margin","利差","B",""],["premium","保费 / 溢价","B","insurance premium 保费"],

["fintech","金融科技","B",""],["consumer protection","消费者保护","B",""],

["insolvency","无力偿债 / 破产","B",""],["restructuring","重组","B",""],

["artificial intelligence","人工智能","C",""],["machine learning","机器学习","C",""],
["deep learning","深度学习","C",""],["algorithm","算法","C",""],["big data","大数据","C",""],
["data mining","数据挖掘","C",""],["analytics","分析（学）","C",""],
["cloud computing","云计算","C",""],["virtualization","虚拟化","C",""],["server","服务器","C",""],

["cryptocurrency","加密货币","C",""],["smart contract","智能合约","C",""],
["digital currency","数字货币","C",""],["central bank digital currency","央行数字货币","C",""],
["encryption","加密","C",""],["cybersecurity","网络安全","C",""],["cyberattack","网络攻击","C",""],
["vulnerability","漏洞 / 脆弱性","C",""],["data breach","数据泄露","C",""],
["phishing","网络钓鱼","C",""],["ransomware","勒索软件","C",""],["privacy","隐私","C",""],
["data protection","数据保护","C",""],["semiconductor","半导体 / 芯片","C",""],
["supply chain","供应链","C",""],["automation","自动化","C",""],
["autonomous driving","自动驾驶","C",""],["platform economy","平台经济","C",""],
["digital transformation","数字化转型","C",""],["innovation","创新","C",""],
["start-up","初创企业","C",""],["e-commerce","电子商务","C",""],

["revenue","收入","D",""],["profit","利润","D",""],["margin","利润率 / 边际","D","profit margin 利润率"],
["earnings","收益","D",""],["merger and acquisition","并购","D",""],["monopoly","垄断","D",""],
["antitrust","反垄断","D",""],["shareholder","股东","D",""],["stakeholder","利益相关方","D",""],
["board","董事会","D",""],["transparency","透明度","D",""],["market share","市场份额","D",""],
["efficiency","效率","D",""],["productivity","生产率","D",""],["incentive","激励","D",""],
["barrier","障碍 / 壁垒","D","barrier to entry 进入壁垒"],["threshold","门槛","D",""],
["mechanism","机制","D",""],["framework","框架","D",""],["initiative","举措","D",""],
["legislation","立法","D",""],["curb","遏制","D","curb inflation 抑制通胀"],
["boost","提振","D","boost demand 提振需求"],["spur","刺激 / 推动","D",""],
["hamper","阻碍","D",""],["impede","妨碍","D",""],["mitigate","缓解","D",""],
["alleviate","缓解","D",""],["enhance","提升","D",""],["reinforce","强化","D",""],
["undermine","削弱","D",""],["tackle","应对","D","tackle risks 应对风险"],
["allocate","分配","D",""],["foster","促进","D",""],["surge","激增","D",""],
["plummet","暴跌","D",""],["offset","抵消","D",""],["erode","侵蚀","D",""],

["indicate","表明","E","the passage indicates that…"],["imply","暗示","E",""],
["infer","推断","E","it can be inferred that 可推断"],["demonstrate","证明 / 展示","E",""],
["assess","评估","E",""],["however","然而 / 不过","E",""],["nevertheless","尽管如此","E",""],
["whereas","然而（表对比）","E",""],["in contrast","相反","E",""],["therefore","因此","E",""],
["consequently","结果 / 因此","E",""],["moreover","此外 / 而且","E",""],
["furthermore","此外","E",""],["despite","尽管","E",""],["albeit","虽然","E",""],
["rather than","而不是","E",""],["unless","除非","E",""],["provided that","假如","E",""],
["given that","考虑到","E",""],["in that","因为","E",""],["optimistic","乐观的","E",""],
["pessimistic","悲观的","E",""],["objective","客观的","E",""],["neutral","中立的","E",""],
["critical","批判的","E",""],["skeptical","怀疑的","E",""],["supportive","支持的","E",""],
["cautious","谨慎的","E",""],["indifferent","漠不关心的","E",""],["ambiguous","含糊的","E",""]
];
const WORDS=RAW.map(a=>({en:a[0],zh:a[1],g:a[2],p:a[3]||""}));
const MAP={}; WORDS.forEach(w=>MAP[w.en]=w);
const GROUPS=[...new Set(WORDS.map(w=>w.g))].sort();
const GNAME={A:"A 宏观经济与金融",B:"B 银行·监管·保险",C:"C 科技与新技术",D:"D 商业与企业",E:"E 逻辑衔接与题干"};
const DAILY_NEW=35, REVIEW_SIZE=30, MASTER_STREAK=3, KEY="jmj_words_v1";

/* ============ 工具 ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ============ 数据 ============ */
let P=load();
function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&o.words)return o}catch(e){}
  return{created:today(),words:{},voice:true}}
function save(){localStorage.setItem(KEY,JSON.stringify(P))}
function statOf(en){return P.words[en]||(P.words[en]={seen:0,right:0,wrong:0,streak:0,introduced:"",last:""})}
function isMastered(s){return s.streak>=MASTER_STREAK&&s.wrong<=1}
function record(en,ok){const s=statOf(en);s.seen++;s.last=today();
  if(ok){s.right++;s.streak++}else{s.wrong++;s.streak=0} save()}
function speak(t){if(!P.voice)return;try{const u=new SpeechSynthesisUtterance(t);
  u.lang="en-US";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

/* ============ 状态 ============ */
let tab="learn", drill=null, sel={group:"0",n:20};

/* ============ 顶部摘要 ============ */
function header(){
  const learned=Object.keys(P.words).filter(e=>MAP[e]).length;
  const m=Object.entries(P.words).filter(([e,s])=>MAP[e]&&isMastered(s)).length;
  const red=Object.entries(P.words).filter(([e,s])=>MAP[e]&&s.wrong>0&&!isMastered(s)).length;
  $("#hdr").textContent=`词库 ${WORDS.length} · 已学 ${learned} · 掌握 ${m} · 红名单 ${red}`;
}

/* ============ 队列（间隔重复） ============ */
function buildQueue(limit,group,onlyWrong){
  const t=new Date(today()); const out=[];
  for(const en in P.words){const w=MAP[en];if(!w)continue;
    if(group&&group!=="0"&&w.g!==group)continue;
    const s=P.words[en];
    if(onlyWrong&&!(s.wrong>0&&!isMastered(s)))continue;
    let sc=s.wrong*3-s.right;
    if(s.last)sc+=Math.max(0,Math.round((t-new Date(s.last))/864e5));
    if(!onlyWrong&&isMastered(s))sc-=6;
    out.push([sc,en]);}
  out.sort((a,b)=>b[0]-a[0]);
  return out.slice(0,limit).map(x=>MAP[x[1]]);
}
function pool(group){return group&&group!=="0"?WORDS.filter(w=>w.g===group):WORDS.slice()}

/* ============ 路由 ============ */
function render(){
  document.querySelectorAll("#tabbar button").forEach(b=>
    b.classList.toggle("active",!drill&&b.dataset.tab===tab));
  if(drill)return renderDrill();
  $("#view").innerHTML=({learn:vLearn,test:vTest,spell:vSpell,red:vRed,stats:vStats})[tab]();
  bind(); header();
}
document.getElementById("tabbar").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  tab=b.dataset.tab; drill=null; window.scrollTo(0,0); render();
});

/* ============ 分组/数量选择器 ============ */
function selectors(){
  return `<div class="card">
    <div class="row"><label class="lb">分组</label>
      <select id="gsel">${['<option value="0">全部</option>']
        .concat(GROUPS.map(g=>`<option value="${g}"${sel.group===g?" selected":""}>${GNAME[g]||g}</option>`)).join("")}</select></div>
    <div class="row"><label class="lb">数量</label>
      <select id="nsel">${[10,20,30,50,100].map(n=>`<option value="${n}"${sel.n===n?" selected":""}>${n} 题</option>`).join("")}</select></div>
  </div>`;
}
function bindSel(){
  const g=$("#gsel"),n=$("#nsel");
  if(g)g.onchange=()=>sel.group=g.value;
  if(n)n.onchange=()=>sel.n=+n.value;
}

/* ============ 各 Tab ============ */
function vLearn(){
  const p=pool(sel.group);
  const news=p.filter(w=>!P.words[w.en]);
  const todayNew=Object.values(P.words).filter(s=>s.introduced===today()).length;
  return selectors()+`<div class="card">
    <div class="statline"><span>今日已学新词</span><b>${todayNew} / ${DAILY_NEW}</b></div>
    <div class="statline"><span>当前分组剩余新词</span><b>${news.length}</b></div>
    <button class="btn" id="goLearn" style="margin-top:14px">${news.length?"开始学习（最多 "+DAILY_NEW+" 个）":"本组新词已学完 🎉"}</button>
    <div class="muted" style="margin-top:12px">💡 建议：学完立刻去「测试」做一遍 4 选 1，效果翻倍。</div>
  </div>`;
}
function vTest(){
  const q=buildQueue(sel.n,sel.group,false);
  return selectors()+`<div class="card">
    <div class="muted">系统会优先推「错过多次 / 久没复习 / 未掌握」的词。</div>
    <button class="btn" id="goTest" style="margin-top:14px">开始选择测试（${q.length} 题）</button>
    <div class="muted" style="margin-top:10px">词库已学 ${Object.keys(P.words).filter(e=>MAP[e]).length} 词</div>
  </div>`;
}
function vSpell(){
  const q=buildQueue(sel.n,sel.group,false);
  return selectors()+`<div class="card">
    <div class="muted">看中文写英文，检验是否真的会拼。</div>
    <button class="btn" id="goSpell" style="margin-top:14px">开始拼写（${q.length} 题）</button>
  </div>`;
}
function vRed(){
  const items=Object.entries(P.words).filter(([e,s])=>MAP[e]&&s.wrong>0&&!isMastered(s))
    .sort((a,b)=>b[1].wrong-a[1].wrong);
  let list=items.map(([e,s])=>{const w=MAP[e];
    return `<div class="reditem"><span>${esc(e)} <span class="muted">${esc(w.zh)}</span></span>
      <span class="n">错${s.wrong}次 · ${GNAME[w.g]||w.g}</span></div>`}).join("");
  return `<div class="card">
    <div class="statline"><span>红名单词数</span><b>${items.length}</b></div>
    <button class="btn" id="goRed" style="margin-top:14px${items.length?"":";opacity:.5"}" ${items.length?"":"disabled"}>刷红名单（${items.length} 题）</button>

    <button class="btn ghost" id="expRed" style="margin-top:10px">导出红名单 txt</button>
  </div>
  <div class="card">${list||'<div class="center muted">太棒了，红名单是空的！</div>'}</div>`;
}
function vStats(){
  const total=WORDS.length;
  const learned=Object.keys(P.words).filter(e=>MAP[e]).length;
  const m=Object.entries(P.words).filter(([e,s])=>MAP[e]&&isMastered(s)).length;
  const red=Object.entries(P.words).filter(([e,s])=>MAP[e]&&s.wrong>0&&!isMastered(s)).length;
  const tn=Object.values(P.words).filter(s=>s.introduced===today()).length;
  const bars=GROUPS.map(g=>{const gw=WORDS.filter(w=>w.g===g);
    const gl=gw.filter(w=>P.words[w.en]).length;
    const gm=gw.filter(w=>P.words[w.en]&&isMastered(P.words[w.en])).length;
    const pct=Math.round(gl/gw.length*100);
    return `<div class="muted">${GNAME[g]||g} <span style="float:right">${gl}/${gw.length} · 掌握${gm}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>`}).join("");
  return `<div class="card">
    <div class="statline"><span>开始日期</span><b>${P.created}</b></div>
    <div class="statline"><span>今天</span><b>${today()}</b></div>
    <div class="statline"><span>词库总量</span><b>${total}</b></div>
    <div class="statline"><span>已学</span><b>${learned}（${Math.round(learned/total*100)}%）</b></div>
    <div class="statline"><span>已掌握</span><b>${m}</b></div>
    <div class="statline"><span>红名单</span><b>${red}</b></div>
    <div class="statline"><span>今日新学</span><b>${tn} / ${DAILY_NEW}</b></div>
  </div>
  <div class="card">${bars}</div>
  <div class="card">
    <div class="row"><label class="lb" style="min-width:auto">🔊 自动发音</label>
      <input type="checkbox" id="voice" ${P.voice?"checked":""} style="width:20px;height:20px"></div>
    <button class="btn ghost" id="exp" style="margin-top:14px">导出进度备份</button>
    <button class="btn ghost" id="imp" style="margin-top:10px">导入进度备份</button>
    <input type="file" id="impFile" accept=".json" hidden>
    <button class="btn ghost" id="rst" style="margin-top:10px;color:#ef4444">重置全部进度</button>
  </div>`;
}

/* ============ 绑定事件 ============ */
function bind(){
  bindSel();
  const on=(id,fn)=>{const el=$("#"+id); if(el)el.onclick=fn;};
  on("goLearn",()=>startLearn(pool(sel.group).filter(w=>!P.words[w.en]).slice(0,DAILY_NEW)));
  on("goTest",()=>start(("choice"),buildQueue(sel.n,sel.group,false)));
  on("goSpell",()=>start("spell",buildQueue(sel.n,sel.group,false)));
  on("goRed",()=>start("choice",buildQueue(999,sel.group,true)));
  on("expRed",()=>{const items=Object.entries(P.words).filter(([e,s])=>MAP[e]&&s.wrong>0&&!isMastered(s));
    const txt=items.map(([e,s])=>`${e}\t${MAP[e].zh}\t错${s.wrong}次`).join("\n")||"（空）";
    download("redlist.txt",txt,"text/plain")});
  on("exp",()=>download("word_progress_"+today()+".json",JSON.stringify(P),"application/json"));
  on("rst",()=>{if(confirm("确定清空所有进度？不可恢复")){P={created:today(),words:{},voice:P.voice};save();render()}});
  const v=$("#voice"); if(v)v.onchange=()=>{P.voice=v.checked;save()};
  const f=$("#impFile"); if(f)f.onchange=e=>{const file=e.target.files[0];if(!file)return;
    const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);
      if(o.words){P=o;P.voice=P.voice!==false;save();render();alert("导入成功")}
      else alert("文件格式不对")}catch(err){alert("解析失败")}};r.readAsText(file)};
  on("imp",()=>$("#impFile").click());
}
function download(name,text,mime){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:mime+";charset=utf-8"}));
  a.download=name;a.click();URL.revokeObjectURL(a.href);
}

/* ============ 开始会话 ============ */
function startLearn(list){
  if(!list.length) return alert("本组新词已学完，去测试吧！");
  drill={mode:"learn",words:shuffle(list),i:0,revealed:false,
         right:0,wrong:0,bad:[],questions:[],title:"学习新词"};
  render();
}

function start(mode,list){
  if(!list.length)return alert("暂无可测的词，先去学几个新词吧");
  const qs=list.map(w=>{
    if(mode==="spell")return{w};
    const others=shuffle(WORDS.filter(x=>x.zh!==w.zh)).slice(0,3);
    const options=shuffle([w,...others]);
    return{w,options,correct:options.indexOf(w)};
  });
  drill={mode,questions:qs,i:0,right:0,wrong:0,bad:[],
    title:mode==="spell"?"拼写测试":"选择测试"};
  render();
}

/* ============ 会话渲染 ============ */
function renderDrill(){
  if(drill.mode==="learn") return drillLearn();
  if(drill.i>=drill.questions.length) return drillDone();
  if(drill.mode==="spell") return drillSpell();
  return drillChoice();
}

function drillTop(){return `<div class="drill-top"><span>${drill.title} ${drill.i+1}/${drill.questions.length}</span>
  <button class="link" id="quit">退出</button></div>
  <div class="progress"><i style="width:${drill.i/drill.questions.length*100}%"></i></div>`}

function drillLearn(){
  const w=drill.words[drill.i];
  $("#view").innerHTML=`<div class="drill-top"><span>学习新词 ${drill.i+1}/${drill.words.length}</span>
    <button class="link" id="quit">退出</button></div>
    <div class="progress"><i style="width:${drill.i/drill.words.length*100}%"></i></div>
    <div class="flashcard" id="fc">
      <div class="chip">${GNAME[w.g]||w.g}</div>
      <div class="w">${esc(w.en)} <button class="spk" id="spk">🔊</button></div>
      ${drill.revealed?`<div class="zh">${esc(w.zh)}</div>${w.p?`<div class="ph">${esc(w.p)}</div>`:""}`
        :`<div class="hint">👆 点击卡片显示释义</div>`}
    </div>
    ${drill.revealed?`<div class="btnrow">
      <button class="btn ok" data-a="1">记住了</button>
      <button class="btn mid" data-a="2">模糊</button>
      <button class="btn bad" data-a="3">不认识</button></div>`:""}`;
  speak(w.en);
  $("#quit").onclick=()=>{drill=null;render()};
  $("#spk").onclick=e=>{e.stopPropagation();const v=P.voice;P.voice=true;speak(w.en);P.voice=v};
  $("#fc").onclick=()=>{if(!drill.revealed){drill.revealed=true;renderDrill()}};
  document.querySelectorAll(".btnrow .btn").forEach(b=>b.onclick=()=>{
    const a=b.dataset.a,s=statOf(w.en);
    s.seen++;s.introduced=today();s.last=today();
    if(a==="1"){s.right++;s.streak++}else if(a==="3"){s.wrong++;s.streak=0}
    save();drill.i++;drill.revealed=false;
    if(drill.i>=drill.words.length){drill.mode="done";drillDone()}
    else renderDrill();
  });
}

function drillChoice(){
  const q=drill.questions[drill.i];
  $("#view").innerHTML=drillTop()+
    `<div class="flashcard" style="min-height:auto;padding:22px 16px">
       <div class="w">${esc(q.w.en)} <button class="spk" id="spk">🔊</button></div>
     </div>
     <div style="margin-top:14px">
     ${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${"ABCD"[i]}. ${esc(o.zh)}</button>`).join("")}
     </div>`;
  speak(q.w.en);
  $("#quit").onclick=()=>{drill=null;render()};
  $("#spk").onclick=e=>{e.stopPropagation();const v=P.voice;P.voice=true;speak(q.w.en);P.voice=v};
  let locked=false;
  document.querySelectorAll(".opt").forEach(btn=>btn.onclick=()=>{
    if(locked)return;locked=true;
    const i=+btn.dataset.i, ok=(i===q.correct);
    document.querySelectorAll(".opt")[q.correct].classList.add("right");
    if(!ok)btn.classList.add("wrong");
    record(q.w.en,ok);
    if(ok)drill.right++;else{drill.wrong++;drill.bad.push(q.w)}
    setTimeout(()=>{drill.i++;renderDrill()},ok?420:900);
  });
}

function drillSpell(){
  const q=drill.questions[drill.i];
  $("#view").innerHTML=drillTop()+
    `<div class="flashcard" style="min-height:auto;padding:24px 16px">
       <div class="zh" style="margin:0">${esc(q.w.zh)}</div>
       ${q.w.p?`<div class="ph">${esc(q.w.p)}</div>`:""}
     </div>
     <div class="row" style="margin-top:14px">
       <input type="text" id="ans" placeholder="输入英文后回车" autocomplete="off"
              autocapitalize="off" autocorrect="off" spellcheck="false">
     </div>
     <button class="btn" id="sub" style="margin-top:10px">提交</button>
     <div id="fb" class="center" style="margin-top:12px;font-size:15px"></div>`;
  const inp=$("#ans");inp.focus();
  $("#quit").onclick=()=>{drill=null;render()};
  const submit=()=>{
    const a=inp.value.trim().toLowerCase();
    if(!a)return;
    const ok=(a===q.w.en.toLowerCase());
    record(q.w.en,ok);
    if(ok)drill.right++;else{drill.wrong++;drill.bad.push(q.w)}
    $("#fb").innerHTML=ok?`<span style="color:#16a34a">✅ 正确</span>`
      :`<span style="color:#ef4444">❌ 正确答案：${esc(q.w.en)}</span>`;
    inp.disabled=true;$("#sub").disabled=true;
    setTimeout(()=>{drill.i++;renderDrill()},ok?420:1100);
  };
  $("#sub").onclick=submit;
  inp.onkeydown=e=>{if(e.key==="Enter")submit()};
}

function drillDone(){
  const n=drill.right+drill.wrong;
  const isLearn=drill.title==="学习新词";
  const pct=n?Math.round(drill.right/n*100):0;
  const bad=(drill.bad||[]).map(w=>
    `<div class="reditem"><span>${esc(w.en)} <span class="muted">${esc(w.zh)}</span></span></div>`
  ).join("");
  $("#view").innerHTML=`<div class="card center">
    <div class="muted">${isLearn?"本轮学习完成":"本轮完成"}</div>
    <div class="big">${isLearn?drill.words.length+" 个新词":drill.right+" / "+n}</div>
    ${isLearn?"":`<div class="muted">正确率 ${pct}%</div>`}
    <button class="btn" id="again" style="margin-top:16px">再来一轮</button>
    <button class="btn ghost" id="back" style="margin-top:10px">返回</button>
  </div>
  ${bad?`<div class="card"><div class="muted" style="margin-bottom:6px">本轮错题（已进红名单）</div>${bad}</div>`:""}`;

  $("#again").onclick=()=>{
    if(isLearn){
      const rest=pool(sel.group).filter(w=>!P.words[w.en]).slice(0,DAILY_NEW);
      drill=null;
      if(rest.length) startLearn(rest); else render();
    }else{
      const m=drill.title==="拼写测试"?"spell":"choice";
      const list=buildQueue(sel.n,sel.group,false);
      drill=null;
      if(list.length) start(m,list); else render();
    }
  };
  $("#back").onclick=()=>{drill=null;render()};
}

/* ============ 启动 ============ */
render();
</script>
</body>
</html>
