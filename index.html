const BUILTIN=RAW.map(a=>({en:a[0],zh:a[1],g:a[2],p:a[3]||"",builtin:true}));
const GNAME={A:"A 宏观经济与金融",B:"B 银行·监管·保险",C:"C 科技与新技术",D:"D 商业与企业",E:"E 逻辑衔接与题干",Z:"Z 我的生词"};
let WORDS=[], MAP={}, GROUPS=[];
const DAILY_NEW=35, REVIEW_SIZE=30, MASTER_STREAK=3, KEY="jmj_words_v1";
/* 重建索引：内置词库 + 用户自定义生词 */
function rebuild(){
  const cust=(P&&P.custom?P.custom:[]).filter(w=>w&&w.en&&w.zh)
    .map(w=>({en:String(w.en).trim(),zh:String(w.zh).trim(),g:(w.g||"Z"),
              p:String(w.p||"").trim(),custom:true}));
  WORDS=BUILTIN.concat(cust);
  MAP={}; WORDS.forEach(w=>MAP[w.en]=w);
  GROUPS=[...new Set(WORDS.map(w=>w.g))].sort();
  GROUPS.forEach(g=>{ if(!GNAME[g]) GNAME[g]=g });
}

/* ============ 工具 ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ============ 数据 ============ */
let P=load();
rebuild();
function load(){try{const o=JSON.parse(localStorage.getItem(KEY));
  if(o&&o.words){
    o.voice=o.voice!==false;
    if(o.audioFallback&&!o.ttsMode) o.ttsMode="online";
    o.ttsMode=o.ttsMode||"auto";
    if(!Array.isArray(o.custom))o.custom=[];
    o.custom=o.custom.filter(w=>w&&w.en&&w.zh).map(w=>({en:String(w.en).trim(),zh:String(w.zh).trim(),g:w.g||"Z",p:w.p||""}));
    return o }}catch(e){}
  return{created:today(),words:{},voice:true,ttsMode:"auto",custom:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}
function statOf(en){return P.words[en]||(P.words[en]={seen:0,right:0,wrong:0,streak:0,introduced:"",last:""})}
function isMastered(s){return s.streak>=MASTER_STREAK&&s.wrong<=1}
function record(en,ok){const s=statOf(en);s.seen++;s.last=today();
  if(ok){s.right++;s.streak++}else{s.wrong++;s.streak=0} save()}

/* ============ 发音（系统语音 / 在线发音，二选一） ============ */
function primeTTS(){
  try{ if(typeof speechSynthesis!=="undefined"){
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
  } }catch(e){}
}
function pickVoice(){
  try{
    const vs=speechSynthesis.getVoices()||[];
    return vs.find(v=>/^en[-_]US/i.test(v.lang)&&/Google|Samantha|Microsoft|Daniel/i.test(v.name))
        || vs.find(v=>/^en[-_]US/i.test(v.lang))
        || vs.find(v=>/^en/i.test(v.lang)) || null;
  }catch(e){ return null }
}
function speakWeb(t,cb){
  if(typeof speechSynthesis==="undefined"||!window.SpeechSynthesisUtterance) return false;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang="en-US"; u.rate=.9; u.volume=1;
    const v=pickVoice(); if(v)u.voice=v;
    u.onend =()=>cb&&cb(true);
    u.onerror=()=>cb&&cb(false);
    speechSynthesis.speak(u);
    setTimeout(()=>{ try{ if(speechSynthesis.paused)speechSynthesis.resume() }catch(e){} },60);
    return true;
  }catch(e){ return false }
}
function speakFallback(t){
  try{
    const a=new Audio("https://dict.youdao.com/dictvoice?type=2&audio="+encodeURIComponent(t));
    a.play().catch(()=>{}); return true;
  }catch(e){ return false }
}
let _lastSpeak=0;
function speak(t){
  if(!P.voice) return;
  const now=Date.now();
  if(now-_lastSpeak<200) return;            /* 防抖：200ms 内只播一次 */
  _lastSpeak=now;
  const m=P.ttsMode||"auto";
  if(m==="online"){ speakFallback(t); return; }
  if(m==="system"){ speakWeb(t); return; }
  const ok=speakWeb(t);
  if(!ok) speakFallback(t);
}
primeTTS();
/* iOS 解锁：第一次触摸静默播一次，之后程序触发的发音才有效 */
document.addEventListener("touchstart",function once(){
  try{ if(typeof speechSynthesis!=="undefined"){
    const u=new SpeechSynthesisUtterance(" "); u.volume=0; u.lang="en-US"; speechSynthesis.speak(u);
  } }catch(e){}
  document.removeEventListener("touchstart",once);
},{passive:true});

/* ============ 顶部摘要 ============ */
function header(){
  const learned=Object.keys(P.words).filter(e=>MAP[e]).length;
  const m=Object.entries(P.words).filter(([e,s])=>MAP[e]&&isMastered(s)).length;
  const red=Object.entries(P.words).filter(([e,s])=>MAP[e]&&s.wrong>0&&!isMastered(s)).length;
  $("#hdr").textContent=`v2.2 · 词库 ${WORDS.length} · 我的生词 ${(P.custom||[]).length} · 已学 ${learned} · 掌握 ${m} · 红名单 ${red}`;
}

/* ============ 队列（间隔重复） ============ */
function buildQueue(limit,group,onlyWrong){
  const t=new Date(today()); const out=[];
  for(const en in P.words){const w=MAP[en];if(!w)continue;
    if(group&&group!=="0"&&w.g!==group)continue;
    const s=P.words[en];
    if(onlyWrong&&!(s.wrong>0&&!isMastered(s)))continue;
    let sc=s.wrong*3-s.right;
    if(s.last)sc+=Math.max(0,Math.round((t-new Date(s.last))/864e5));
    if(!onlyWrong&&isMastered(s))sc-=6;
    out.push([sc,en]);}
  out.sort((a,b)=>b[0]-a[0]);
  return out.slice(0,limit).map(x=>MAP[x[1]]);
}
function pool(group){return group&&group!=="0"?WORDS.filter(w=>w.g===group):WORDS.slice()}

}

/* ============ 生词本（自定义词库） ============ */
function splitLine(line){
  let parts;
  if(/[\t|;；]/.test(line)) parts=line.split(/\s*[\t|;；]\s*/);
  else{ const i=line.search(/[,，、]/); parts = i<0?[line]:[line.slice(0,i), line.slice(i+1)]; }
  return parts.map(s=>s.trim()).filter(s=>s!=="");
}
function mkWord(parts,defG){
  const en=(parts[0]||"").trim(), zh=(parts[1]||"").trim();
  let g="",p="";
  const rest=parts.slice(2).map(s=>String(s).trim()).filter(Boolean);
  if(rest.length){
    if(/^[A-Za-z]$/.test(rest[0])){ g=rest[0].toUpperCase(); p=rest.slice(1).join(", ") }
    else p=rest.join(", ");
  }
  return {en:en,zh:zh,g:g||defG||"Z",p:p};
}
function addWords(list,defG){
  P.custom=Array.isArray(P.custom)?P.custom:[];
  let add=0,upd=0,skip=0;
  (list||[]).forEach(w=>{
    const en=w&&w.en?String(w.en).trim():"", zh=w&&w.zh?String(w.zh).trim():"";
    if(!en||!zh){skip++;return}
    if(BUILTIN.some(b=>b.en.toLowerCase()===en.toLowerCase())){skip++;return}
    const ex=P.custom.find(c=>String(c.en).toLowerCase()===en.toLowerCase());
    if(ex){ ex.en=en; ex.zh=zh; ex.g=w.g||ex.g||"Z"; ex.p=w.p||ex.p||""; upd++ }
    else{ P.custom.push({en:en,zh:zh,g:w.g||defG||"Z",p:w.p||""}); add++ }
  });
  save(); rebuild();
  return {add:add,upd:upd,skip:skip};
}
function handleCustomText(text,defG){
  text=String(text||"").replace(/^\uFEFF/,"").trim();
  const list=[];
  if(text[0]==="["||text[0]==="{"){
    let arr=null;
    try{ const o=JSON.parse(text); arr=Array.isArray(o)?o:(Array.isArray(o.words)?o.words:null); }
    catch(e){ return {add:0,upd:0,skip:0,error:"JSON 解析失败，检查一下括号和引号"} }
    if(!arr) return {add:0,upd:0,skip:0,error:"JSON 里没找到词条数组"};
    arr.forEach(it=>{
      if(Array.isArray(it)) list.push(mkWord(it.map(String),defG));
      else if(it&&typeof it==="object"&&it.en) list.push(mkWord([it.en,it.zh||it.cn||it.mean||"",it.g||"",it.p||it.example||""],defG));
    });
  }else{
    text.split(/\r?\n/).forEach(line=>{
      line=line.trim(); if(!line||line[0]==="#")return;
      list.push(mkWord(splitLine(line),defG));
    });
  }
  return addWords(list,defG);
}
function sumMsg(r){
  if(r.error) return "❌ "+r.error;
  const p=[];
  if(r.add)p.push("新增 "+r.add);
  if(r.upd)p.push("更新 "+r.upd);
  if(r.skip)p.push("跳过 "+r.skip+"（重复或信息不全）");
  return p.length? ("✅ "+p.join(" · ")) : "⚠️ 没识别到有效词条，检查每行是否为「英文, 中文」";
}

function download(name,text,mime){

/* ============ 开始会话 ============ */
function startLearn(list){
  if(!list.length) return alert("本组新词已学完，去测试吧！");
  drill={mode:"learn",words:shuffle(list),i:0,revealed:false,spoken:-1,
         right:0,wrong:0,bad:[],questions:[],title:"学习新词"};
  render();
}

function start(mode,list){
  if(!list.length)return alert("暂无可测的词，先去学几个新词吧");
  const qs=list.map(w=>{
    if(mode==="spell")return{w};
    const others=shuffle(WORDS.filter(x=>x.zh!==w.zh)).slice(0,3);
    const options=shuffle([w,...others]);
    return{w,options,correct:options.indexOf(w)};
  });
  drill={mode,questions:qs,i:0,right:0,wrong:0,bad:[],
    title:mode==="spell"?"拼写测试":"选择测试"};
  render();
}

/* ============ 会话渲染 ============ */
function renderDrill(){
  if(drill.mode==="learn") return drillLearn();
  if(drill.i>=drill.questions.length) return drillDone();
  if(drill.mode==="spell") return drillSpell();
  return drillChoice();
}

function drillTop(){return `<div class="drill-top"><span>${drill.title} ${drill.i+1}/${drill.questions.length}</span>
  <button class="link" id="quit">退出</button></div>
  <div class="progress"><i style="width:${drill.i/drill.questions.length*100}%"></i></div>`}

function drillLearn(){
  const w=drill.words[drill.i];
  $("#view").innerHTML=`<div class="drill-top"><span>学习新词 ${drill.i+1}/${drill.words.length}</span>
    <button class="link" id="quit">退出</button></div>
    <div class="progress"><i style="width:${drill.i/drill.words.length*100}%"></i></div>
    <div class="flashcard" id="fc">
      <div class="chip">${GNAME[w.g]||w.g}</div>
      <div class="w">${esc(w.en)} <button class="spk" id="spk">🔊</button></div>
      ${drill.revealed?`<div class="zh">${esc(w.zh)}</div>${w.p?`<div class="ph">${esc(w.p)}</div>`:""}`
        :`<div class="hint">👆 点击卡片显示释义</div>`}
    </div>
    ${drill.revealed?`<div class="btnrow">
      <button class="btn ok" data-a="1">记住了</button>
      <button class="btn mid" data-a="2">模糊</button>
      <button class="btn bad" data-a="3">不认识</button></div>`:""}`;
  if(drill.spoken!==drill.i){ drill.spoken=drill.i; speak(w.en); }
  $("#quit").onclick=()=>{drill=null;render()};
  $("#spk").onclick=e=>{e.stopPropagation();
    const v=P.voice;P.voice=true;_lastSpeak=0;speak(w.en);P.voice=v;};
  $("#fc").onclick=()=>{if(!drill.revealed){drill.revealed=true;renderDrill()}};
  document.querySelectorAll(".btnrow .btn").forEach(b=>b.onclick=()=>{
    const a=b.dataset.a,s=statOf(w.en);
    s.seen++;s.introduced=today();s.last=today();
    if(a==="1"){s.right++;s.streak++}else if(a==="3"){s.wrong++;s.streak=0}
    save();drill.i++;drill.revealed=false;
    if(drill.i>=drill.words.length){drill.mode="done";drillDone()}
    else renderDrill();
  });
}

function drillChoice(){
  const q=drill.questions[drill.i];
  $("#view").innerHTML=drillTop()+
    `<div class="flashcard" style="min-height:auto;padding:22px 16px">
       <div class="w">${esc(q.w.en)} <button class="spk" id="spk">🔊</button></div>
     </div>
     <div style="margin-top:14px">
     ${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${"ABCD"[i]}. ${esc(o.zh)}</button>`).join("")}
     </div>`;
  speak(q.w.en);
  $("#quit").onclick=()=>{drill=null;render()};
  $("#spk").onclick=e=>{e.stopPropagation();
    const v=P.voice;P.voice=true;_lastSpeak=0;speak(q.w.en);P.voice=v;};
  let locked=false;
  document.querySelectorAll(".opt").forEach(btn=>btn.onclick=()=>{
    if(locked)return;locked=true;
    const i=+btn.dataset.i, ok=(i===q.correct);
    document.querySelectorAll(".opt")[q.correct].classList.add("right");
    if(!ok)btn.classList.add("wrong");
    record(q.w.en,ok);
    if(ok)drill.right++;else{drill.wrong++;drill.bad.push(q.w)}
    setTimeout(()=>{drill.i++;renderDrill()},ok?420:900);
  });
}

function drillSpell(){
  const q=drill.questions[drill.i];
  $("#view").innerHTML=drillTop()+
    `<div class="flashcard" style="min-height:auto;padding:24px 16px">
       <div class="zh" style="margin:0">${esc(q.w.zh)}</div>
       ${q.w.p?`<div class="ph">${esc(q.w.p)}</div>`:""}
     </div>
     <div class="row" style="margin-top:14px">
       <input type="text" id="ans" placeholder="输入英文后回车" autocomplete="off"
              autocapitalize="off" autocorrect="off" spellcheck="false">
     </div>
     <button class="btn" id="sub" style="margin-top:10px">提交</button>
     <div id="fb" class="center" style="margin-top:12px;font-size:15px"></div>`;
  const inp=$("#ans");inp.focus();
  $("#quit").onclick=()=>{drill=null;render()};
  const submit=()=>{
    const a=inp.value.trim().toLowerCase();
    if(!a)return;
    const ok=(a===q.w.en.toLowerCase());
    record(q.w.en,ok);
    if(ok)drill.right++;else{drill.wrong++;drill.bad.push(q.w)}
    $("#fb").innerHTML=ok?`<span style="color:#16a34a">✅ 正确</span>`
      :`<span style="color:#ef4444">❌ 正确答案：${esc(q.w.en)}</span>`;
    inp.disabled=true;$("#sub").disabled=true;
    setTimeout(()=>{drill.i++;renderDrill()},ok?420:1100);
  };
  $("#sub").onclick=submit;
  inp.onkeydown=e=>{if(e.key==="Enter")submit()};
}

function drillDone(){
  const n=drill.right+drill.wrong;
  const isLearn=drill.title==="学习新词";
  const pct=n?Math.round(drill.right/n*100):0;
  const bad=(drill.bad||[]).map(w=>
    `<div class="reditem"><span>${esc(w.en)} <span class="muted">${esc(w.zh)}</span></span></div>`
  ).join("");
  $("#view").innerHTML=`<div class="card center">
    <div class="muted">${isLearn?"本轮学习完成":"本轮完成"}</div>
    <div class="big">${isLearn?drill.words.length+" 个新词":drill.right+" / "+n}</div>
    ${isLearn?"":`<div class="muted">正确率 ${pct}%</div>`}
    <button class="btn" id="again" style="margin-top:16px">再来一轮</button>
    <button class="btn ghost" id="back" style="margin-top:10px">返回</button>
  </div>
  ${bad?`<div class="card"><div class="muted" style="margin-bottom:6px">本轮错题（已进红名单）</div>${bad}</div>`:""}`;

  $("#again").onclick=()=>{
    if(isLearn){
      const all=pool(sel.group).filter(w=>!P.words[w.en]);
      const rest=all.slice(0, sel.newN===0?all.length:sel.newN);
      drill=null;
      if(rest.length) startLearn(rest); else render();
    }else{
      const m=drill.title==="拼写测试"?"spell":"choice";
      const list=buildQueue(sel.n,sel.group,false);
      drill=null;
      if(list.length) start(m,list); else render();
    }
  };
  $("#back").onclick=()=>{drill=null;render()};
}

/* ============ 启动 ============ */
render();
</script>
</body>
</html>
